<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ===== BASIC SEO ===== -->
    <title>Afshan Hospital - Online Appointment & Patient Portal</title>
    <meta
      name="description"
      content="Afshan Hospital ka official portal. Online appointment booking, doctor consultation, patient records aur 24/7 emergency services."
    />
    <meta
      name="keywords"
      content="Afshan Hospital, online appointment, doctor booking, patient portal, hospital management, healthcare, Pakistan hospital"
    />
    <meta name="author" content="Afshan Hospital" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#667eea" />

    <!-- ===== OPEN GRAPH (WhatsApp / Facebook / LinkedIn) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://afshan-hospital-frontend.vercel.app/" />
    <meta property="og:title" content="Afshan Hospital Management System" />
    <meta
      property="og:description"
      content="Book appointments, manage patient records, and access healthcare services online."
    />
    <meta
      property="og:image"
      content="https://afshan-hospital-frontend.vercel.app/logo192.png"
    />

    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Afshan Hospital" />
    <meta
      name="twitter:description"
      content="Online appointment & patient portal."
    />
    <meta
      name="twitter:image"
      content="https://afshan-hospital-frontend.vercel.app/logo192.png"
    />

    <!-- ===== STRUCTURED DATA (Google Rich Results) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hospital",
        "name": "Afshan Hospital",
        "url": "https://afshan-hospital-frontend.vercel.app",
        "logo": "https://afshan-hospital-frontend.vercel.app/logo192.png",
        "description": "Online appointment booking and patient portal for Afshan Hospital.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "PK"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+92-1122",
          "contactType": "emergency"
        }
      }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
